name: Generate Activity Graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build activity graph SVG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // ===== 설정: 여기만 바꾸면 됩니다 =====
            const DAYS = 180;
            const TITLE = 'Daily Commit Activity';
            // ====================================

            const login = context.repo.owner;
            const to = new Date();
            const from = new Date(to.getTime() - (DAYS - 1) * 864e5);
            const fromStr = from.toISOString().slice(0, 10);

            const query = 'query($login:String!,$from:DateTime!,$to:DateTime!){'
              + ' user(login:$login){ contributionsCollection(from:$from,to:$to){'
              + ' contributionCalendar{ weeks{ contributionDays{ date contributionCount } } } } } }';

            const res = await github.graphql(query, {
              login, from: from.toISOString(), to: to.toISOString()
            });

            const raw = res.user.contributionsCollection.contributionCalendar.weeks
              .flatMap(w => w.contributionDays)
              .filter(d => d.date >= fromStr)
              .sort((a, b) => a.date.localeCompare(b.date));

            const total = raw.reduce((s, d) => s + d.contributionCount, 0);
            const weekly = raw.length > 70;

            let series = [];
            if (weekly) {
              for (let i = 0; i < raw.length; i += 7) {
                const c = raw.slice(i, i + 7);
                series.push({ date: c[0].date, value: c.reduce((s, d) => s + d.contributionCount, 0) });
              }
            } else {
              series = raw.map(d => ({ date: d.date, value: d.contributionCount }));
            }

            const W = 880, H = 340, PL = 58, PR = 30, PT = 95, PB = 46;
            const iw = W - PL - PR, ih = H - PT - PB, base = PT + ih;
            const n = series.length;
            const max = Math.max(1, ...series.map(d => d.value));
            const X = i => PL + (n < 2 ? iw / 2 : (iw * i) / (n - 1));
            const Y = v => base - (ih * v) / max;
            const clamp = y => Math.min(base, Math.max(PT, y));
            const pts = series.map((d, i) => [X(i), Y(d.value)]);

            let line = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
            for (let i = 0; i < n - 1; i++) {
              const p0 = pts[i - 1] || pts[i], p1 = pts[i];
              const p2 = pts[i + 1], p3 = pts[i + 2] || p2;
              const c1x = p1[0] + (p2[0] - p0[0]) / 6;
              const c1y = clamp(p1[1] + (p2[1] - p0[1]) / 6);
              const c2x = p2[0] - (p3[0] - p1[0]) / 6;
              const c2y = clamp(p2[1] - (p3[1] - p1[1]) / 6);
              line += ' C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ', '
                + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ', '
                + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
            }
            const area = line + ' L' + X(n - 1).toFixed(1) + ' ' + base
              + ' L' + X(0).toFixed(1) + ' ' + base + ' Z';

            const ticks = Array.from(new Set([0, Math.round(max / 3), Math.round(max * 2 / 3), max]));
            const grid = ticks.map(v =>
              '<line x1="' + PL + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - PR)
              + '" y2="' + Y(v).toFixed(1) + '" stroke="#ededed" stroke-width="1" stroke-dasharray="3 4"/>'
              + '<text x="' + (PL - 12) + '" y="' + (Y(v) + 4).toFixed(1)
              + '" text-anchor="end" font-size="11" fill="#8b8b8b">' + v + '</text>'
            ).join('');

            const step = Math.max(1, Math.ceil(n / 8));
            const xlabels = series.map((d, i) => {
              const last = i === n - 1;
              if (!last && (i % step !== 0 || n - 1 - i < step * 0.6)) return '';
              const p = d.date.split('-');
              return '<text x="' + X(i).toFixed(1) + '" y="' + (base + 24)
                + '" text-anchor="middle" font-size="11" fill="#8b8b8b">'
                + Number(p[1]) + '/' + Number(p[2]) + '</text>';
            }).join('');

            const dots = n <= 40 ? pts.map(p =>
              '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1)
              + '" r="2.6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>'
            ).join('') : '';

            let peak = 0;
            for (let i = 1; i < n; i++) if (series[i].value > series[peak].value) peak = i;
            const px = X(peak), py = Y(series[peak].value);
            const peakMark = '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1)
              + '" r="4.5" fill="#ffffff" stroke="#111111" stroke-width="2.2"/>'
              + '<text x="' + px.toFixed(1) + '" y="' + (py - 13).toFixed(1)
              + '" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">'
              + series[peak].value + '</text>';

            const sub = 'last ' + DAYS + ' days · ' + (weekly ? 'weekly' : 'daily')
              + ' · ' + total + ' contributions';

            const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H
              + '" viewBox="0 0 ' + W + ' ' + H
              + '" font-family="Segoe UI, Noto Sans KR, Helvetica, Arial, sans-serif">'
              + '<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">'
              + '<stop offset="0%" stop-color="#111111" stop-opacity="0.18"/>'
              + '<stop offset="100%" stop-color="#111111" stop-opacity="0.02"/>'
              + '</linearGradient></defs>'
              + '<rect width="' + W + '" height="' + H + '" rx="10" fill="#ffffff"/>'
              + '<text x="' + PL + '" y="48" font-size="22" font-weight="700" fill="#111111">' + TITLE + '</text>'
              + '<text x="' + PL + '" y="70" font-size="12.5" fill="#8b8b8b">' + sub + '</text>'
              + grid
              + '<line x1="' + PL + '" y1="' + base + '" x2="' + (W - PR)
              + '" y2="' + base + '" stroke="#d9d9d9" stroke-width="1"/>'
              + '<path d="' + area + '" fill="url(#fade)"/>'
              + '<path d="' + line + '" fill="none" stroke="#111111" stroke-width="2.2"'
              + ' stroke-linejoin="round" stroke-linecap="round"/>'
              + dots + peakMark + xlabels
              + '</svg>';

            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/activity-graph.svg', svg);

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update activity graph [skip ci]"
